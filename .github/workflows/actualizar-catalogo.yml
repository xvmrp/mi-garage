# Cada lunes descarga las listas de la Hot Wheels Wiki y, si hay autos nuevos o cambios,
# guarda el catálogo en el repositorio y publica la app.
# También se puede ejecutar a mano: pestaña Actions -> "Actualizar catálogo" -> Run workflow.
name: Actualizar catálogo

on:
  schedule:
    - cron: "17 9 * * 1" # lunes 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    outputs:
      cambio: ${{ steps.revisar.outputs.cambio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar la wiki y generar el catálogo
        run: python importador/importar.py --actualizar

      - id: revisar
        name: ¿Cambió algo?
        run: |
          if git diff --quiet -- app/datos/catalogo.json; then
            echo "cambio=no" >> "$GITHUB_OUTPUT"
            echo "El catálogo no cambió."
          else
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          fi

      # Si la wiki cambió de forma rara y el catálogo salió malo, se detiene aquí y no se guarda
      - uses: actions/setup-node@v4
        if: steps.revisar.outputs.cambio == 'si'
        with:
          node-version: 22
      - name: Revisar el catálogo nuevo
        if: steps.revisar.outputs.cambio == 'si'
        run: node --test pruebas/catalogo.test.js

      - name: Guardar el catálogo nuevo
        if: steps.revisar.outputs.cambio == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/datos/catalogo.json
          git commit -m "Actualizar catálogo desde la Hot Wheels Wiki"
          git push

  publicar:
    needs: actualizar
    if: needs.actualizar.outputs.cambio == 'si'
    uses: ./.github/workflows/publicar.yml
